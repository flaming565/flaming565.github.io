<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keepra — Постоянство без усилий</title>
<style>
  :root {
    --teal: #3E9EA8; --teal-deep: #2D7479; --bg: #F8FAFB;
    --text: #1A2B2D; --mid: #5A6A72; --sub: #9AAAB4; --border: #E8EEF0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 40px 20px; text-align: center;
  }
  .wrap { max-width: 480px; }
  .logo { color: var(--teal); font-weight: 800; letter-spacing: 6px; font-size: 32px; margin-bottom: 8px; }
  .tagline { color: var(--sub); font-style: italic; margin-bottom: 32px; }
  p { color: var(--mid); margin-bottom: 16px; }
  a { color: var(--teal); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  .links { margin-top: 24px; }
  .links a { display: inline-block; margin: 0 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">KEEPRA</div>
  <div class="tagline">Постоянство без усилий · Consistency without effort</div>
  <p>Рутины, привычки и цели — в одном приложении.</p>
  <div class="links">
    <a href="https://flaming565.github.io/keepra-site/">Поддержка / Support</a>
    <a href="https://flaming565.github.io/keepra-site/privacy.html">Privacy Policy</a>
  </div>
</div>
</body>
</html>
